<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privacy & AI guidance Q&A</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;color:#222}
 form{display:flex;gap:8px} input{flex:1;padding:10px;font-size:16px} button{padding:10px 16px}
 #answer{white-space:pre-wrap;margin-top:24px;line-height:1.5} li{margin:6px 0} small{color:#666}
</style>
</head>
<body>
<h1>Privacy &amp; AI guidance Q&amp;A</h1>
<p><small>Answers come only from OAIC guidance (CC BY 4.0). Not legal advice.</small></p>
<form id="f"><input id="q" placeholder="e.g. Can we put customer data into a generative AI tool?" required>
<button>Ask</button></form>
<div id="answer"></div><ol id="sources"></ol>
<script>
const $ = id => document.getElementById(id);
$("f").onsubmit = async e => {
  e.preventDefault(); $("answer").textContent = "Thinking…"; $("sources").innerHTML = "";
  const r = await fetch("/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                 body: JSON.stringify({question: $("q").value})});
  const d = await r.json();
  $("answer").textContent = d.answer ?? JSON.stringify(d);
  for (const s of d.sources ?? []) {
    const li = document.createElement("li"); li.value = s.n;
    const a = document.createElement("a"); a.href = s.url; a.target = "_blank"; a.textContent = s.title;
    li.append(a, ` — ${s.section}`); $("sources").append(li);
  }
};
</script>
</body>
</html>
